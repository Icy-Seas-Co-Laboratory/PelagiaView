null_settings = [ "minPerimeter", "refinementExpansionPixels", "refinementModelBatchSize", "zstdMinBytes" ]

[preset]
id = "tellecentric-default"
name = "Tellecentric Imaging System (default)"
description = "Standard presets for analyzing images from a Wassoc-like shadowgraph glider tellecentric imaging sensor."
updated_at = "2026-06-23T21:48:14.751Z"

[settings.preprocessing]
backgroundCorrection = true
backgroundFrameLimit = 100
backgroundMinFieldValue = 50
backgroundMaxFieldValue = 255
flatfieldCorrection = false
applyMask = false
cropEnabled = true
cropX = 750
cropY = 200
cropW = 2800
cropH = 2800
invertIntensity = true

[settings.threshold]
thresholdMethod = "manual"
manualThreshold = 50

[settings.mask_augmentation]
maskAugmentationEnabled = false

[settings.candidate_detection]
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
minWidth = 20
minHeight = 20
padding = 50

[settings.roi_storage]
roiEncoding = "zstd"
alwaysStoreMask = true


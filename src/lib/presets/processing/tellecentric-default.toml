[preset]
id = "tellecentric-default"
name = "Telecentric imaging system default"
description = "Area-scan defaults for telecentric shadowgraph imagery with a fixed crop, stored background-field preprocessing, manual thresholding, and connected-component candidate ROI assembly."

[settings.ingestion]
ingestionScanMode = "area_scan"
ingestionBackgroundWindowWidth = 25
ingestionBackgroundWindowStride = 25

[settings.preprocessing]
minFieldValue = 50
maxFieldValue = 255
applyMask = false
cropEnabled = true
cropX = 750
cropY = 200
cropW = 2800
cropH = 2800

[settings.threshold]
thresholdMethod = "manual"
manualThreshold = 50

[settings.candidate_detection]
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
minWidth = 16
minHeight = 16
padding = 50

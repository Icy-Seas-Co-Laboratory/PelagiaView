[preset]
id = "linescan-default"
name = "Line scan default"
description = "Baseline line-scan workflow using ingestion-generated flatfield profiles, stored-field preprocessing, manual thresholding, and connected-component candidate ROI assembly."

[settings.ingestion]
ingestionScanMode = "line_scan"
ingestionLineScanAxis = 0
ingestionFlatfieldWindowWidth = 1
ingestionFlatfieldWindowStride = 1

[settings.preprocessing]
minFieldValue = 20
maxFieldValue = 255

[settings.threshold]
thresholdMethod = "manual"
manualThreshold = 100

[settings.candidate_detection]
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
minWidth = 8
minHeight = 8
padding = 50

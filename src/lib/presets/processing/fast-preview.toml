[preset]
id = "fast-preview"
name = "Fast preview"
description = "Minimal mask operations for quick interactive passes while tuning frames."

null_settings = [
  "minArea",
  "maxArea",
  "maxPerimeter",
  "minWidth",
  "maxWidth",
  "minHeight",
  "maxHeight",
  "zstdMinBytes",
]

[settings]
thresholdMethod = "bounded_otsu"
thresholdingMaximumValue = 100
boundedOtsuMinContrast = 60
boundedOtsuMaxForegroundFraction = 0.45
cannyEnabled = false
maskAugmentationEnabled = false
maskAugmentationSteps = ["none"]
fillHoles = false
removeSmallComponents = false
clearBorder = false
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
backgroundCorrection = false
flatfieldCorrection = false
applyMask = false
cropEnabled = false
invertIntensity = false
minPerimeter = 120
padding = 80
roiEncoding = "png"
alwaysStoreMask = false
refinementModelKind = "identity"
refinementModelArtifact = "auto"
refinementTileSize = 256
refinementOverlapFraction = 0.2
refinementOutputThreshold = 0.5
refinementAllowFrameExpansion = true
refinementMaxIterations = 2
refinementEdgeTouchMargin = 1
refinementEncoding = "auto"


[preset]
id = "areascan-default"
name = "Area scan default"
description = "Baseline area-scan workflow using ingestion-generated background fields, stored-field preprocessing, manual thresholding, and connected-component candidate ROI assembly."

[settings.ingestion]
ingestionScanMode = "area_scan"
ingestionBackgroundWindowWidth = 25
ingestionBackgroundWindowStride = 25

[settings.preprocessing]
minFieldValue = 25
maxFieldValue = 255
applyMask = false
cropEnabled = false

[settings.threshold]
thresholdMethod = "manual"
manualThreshold = 100

[settings.candidate_detection]
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
minWidth = 12
minHeight = 12
padding = 50

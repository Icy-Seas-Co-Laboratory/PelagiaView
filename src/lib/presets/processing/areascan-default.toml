[preset]
id = "areascan-default"
name = "Areascan default"
description = "Higher-sensitivity bounded Otsu settings for area-scan ROI candidates."

[settings.preprocessing]
backgroundCorrection = true

[settings.threshold]
thresholdMethod = "bounded_otsu_canny"
thresholdingMaximumValue = 100
boundedOtsuMinContrast = 25
boundedOtsuMaxForegroundFraction = 0.7
cannyEnabled = true
cannyLowThreshold = 40
cannyHighThreshold = 100
cannyBlurKernel = 5

[settings.mask_augmentation]
maskAugmentationEnabled = true
maskAugmentationSteps = ["dilate", "fill_holes", "remove_small_components"]
dilateKernelW = 3
dilateKernelH = 3
dilateIterations = 1
fillHoles = true
removeSmallComponents = true
minComponentArea = 4

[settings.candidate_detection]
roiAssemblyMethod = "connected_components"
roiAssemblyConnectivity = 8
minArea = 4
minPerimeter = 40
minWidth = 2
minHeight = 2
padding = 120

[settings.roi_storage]
roiEncoding = "zstd"
alwaysStoreMask = true

[settings.refinement]
refinementOutputThreshold = 0.45
refinementAllowFrameExpansion = true
refinementMaxIterations = 4

